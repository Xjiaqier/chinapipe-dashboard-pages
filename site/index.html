s.xlsx";if(staticExcelUrl){const staticExcelButton=document.getElementById("export-btn");if(staticExcelButton){staticExcelButton.addEventListener("click",(event)=>{event.preventDefault();event.stopImmediatePropagation();window.location.assign(staticExcelUrl);});}}(function(){const btn=document.getElementById("export-btn");if(!btn)return;const b64="external-workbook";btn.addEventListener("click",()=>{const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++){bytes[i]=raw.charCodeAt(i);}const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="matches.xlsx";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);btn.textContent="下载中...";setTimeout(()=>{btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 Excel';},1500);});})();</script></main></body></html>
