：请各潜在投标人自行踏勘并充分评估项目履约期间可能出现的各类影响因素，结合自身实力及市场行情 报价，将相关风险费用统筹纳入投标总价，故本条款不予修改，请按招标文件执行。 问题18.招标文件P139，专用条款7.8.3 指示暂停施工“监理人认为有必要时，可向承包人做出暂停施工的指示， 承包人应按监理人指示暂停施工，承包人应考虑暂停施工的风险及损失，且不得提出费用索赔，相关费用已包 含在签约合同价中。”疑问：暂停施工若系发包人原因（资金、征地、指令等原因）所致，承包人停工窝工损 失客观发生且无法在投标时预见，本条一律禁止费用索赔并称“已包含在签约合同价中”，明显不切实际，实 质免除发包人赔偿责任。修改建议：区分暂停原因：因发包人原因暂停的，应顺延工期并赔偿承包人实际损失； 因承包人原因暂停的，费用由承包人承担。 回复：投标人参与投标，即表明其已对工程现场及周边环境、工期安排、气候条件、政策变化等可能引发暂停 施工的各类因素进行了充分评估与考量，并在此基础上合理报价，将相关风险费用纳入投标报价。若暂停施工 系因承包人自身原因导致，相应后果理应由承包人自行承担；若系因发包人原因导致，合同条款已在专用合同 条款第7.5.1项中明确了工期顺延的途径，这属于合同当事人对风险分配的自主约定，相关约定内容不违反法律法 规强制性规定。故本条款不予修改，请按招标文件执行。 网 问题19.招标文件P147，专用条款11.1 市场价格波动引起的调整“因市场价格波动引起的价格均不调整，人工材料 价差均不调整，且通用合同条款第11.1条不适用。”疑问：本项目为大型污水处理厂工程，建设周期长，完全排 除人工、材料价格调整，将市场价格上涨风险全部由承包人承担。钢材、水泥、人工价格大幅波动时承包人可 能严重亏损，权利义务明显失衡，显失公平。修改建议：约定主要材料（钢材、水泥、商品混凝土等）及人工 务 价格波动超过约定幅度（如±5%）时按信息价调整价差。 回复：本项目工期小于一年，价格风险处于行业可预见、可承受的合理范围内。按招标文件要求执行。 商 问题20.招标文件P150-151，专用条款12.4.4 进道度款支付、结算审核“月进度付款，发包人均按当期……审核合格 的工程量向承包人支付对应施工进度款的80%，当支付至合同价的80%时，停止支付……经发包人委托的中介单 位或审计部门（如有）完成竣工结算审核后28天内支付至结算审定金额的97%……若承包人所报结算监理初审和 （或）第三方审核时，审减率超过5%，则承包人应承担审减费。” 管 疑问：第一，进度款仅付80%，且未约定进度款迟延支付的违约责任，承包人垫资压力巨大。第二，“完成竣工 结算审核后支付至97%”，若审计拖延数年，结算款长期被占用。第三，审减率超过5%即由承包人承担审减费， 审减额受编制口径影响，不能当然归责于承包人。修改建议：提高进度款支付比例至85%-90%；约定结算审核期 限，逾期按LPR计付逾期利息；审减费仅针对承包人故意高估冒算部分。 国 回复：进度款支付至80%，是工程建设领域常见支付方式。竣工结算审核期限以招标人内部审核流程实际所需时 间为准，请各投标人在投标报价及资金安排中充分预估相关时间风险，合理统筹资金使用计划。 中 问题21.招标文件P116，专用条款1.5 合同文件的优先顺序“若同一文件中对同一事项作出不同规定，则以利于发 包人解释为准。”疑问：合同文本由发包人提供，属格式条款。按《民法典》第498条，对格式条款有两种以上 解释的，应当作出不利于提供格式条款一方的解释。本条反其道而行之，规定“以利于发包人解释为准”，使 发包人可在争议时任意选取有利解释，排除承包人正当权利，应属无效。修改建议：删除“以利于发包人解释 为准”，改为“按通常理解解释；有两种以上解释的，以不利于提供格式条款一方的解释为准”。最后，合同 文件优先顺序已在专用合同条款第1.5条中作出了明确、具体、可执行的约定，投标人参与投标即视为接受该条 款约束，不存在“有两种以上解释”的情形。 回复：投标人参与投标，即表明其已对工程现场及周边环境、工期安排、气候条件、政策变化等可能引发暂停 施工的各类因素进行了充分评估与考量，并在此基础上合理报价，将相关风险费用纳入投标报价。若暂停施工 系因承包人自身原因导致，相应后果理应由承包人自行承担；若系因发包人原因导致，合同条款已在专用合同 条款第7.5.1项中明确了工期顺延的途径，这属于合同当事人对风险分配的自主约定，相关约定内容不违反法律法 规强制性规定。故本条款不予修改，请按招标文件执行。 问题22.招标文件P122，专用条款2.4.1.1 提供施工现场（分次交地）“施工场地、施工条件、基础资料未能按约定 提供，影响项目关键线路的，承包人可在受影响之日起28日内提交书面工期顺延申请……除此之外，发包人不承 担违约责任等任何责任。上述情况不视为发包人违约。”疑问：按时提供施工场地是发包人的基本合同义务。 迟延交地造成承包人停工、窝工、机械租赁等实际损失，本条却明文“不视为发包人违约”、不承担任何责任， 只允许顺延工期，实质免除发包人主要责任，违反公平原则。修改建议：发包人迟延交地的，除工期顺延外， 应赔偿承包人实际发生的停工窝工、设备闲置等损失；迟延超过约定期限的，承包人有权解除合同并索赔。 回复：投标人参与投标，即表明其已对工程现场及周边环境、工期安排、气候条件、政策变化等可能引发暂停 施工的各类因素进行了充分评估与考量，并在此基础上合理报价，将相关风险费用纳入投标报价。若暂停施工 系因承包人自身原因导致，相应后果理应由承包人自行承担；若系因发包人原因导致，合同条款已在专用合同 条款第7.5.1项中明确了工期顺延的途径，这属于合同当事人对风险分配的自主约网定，相关约定内容不违反法律法 规强制性规定。故本条款不予修改，请按招标文件执行。 务 问题23.招标文件P122，专用条款2.4.3.1 工程地质资料和地下管线资料的提供“承包人应现场核实并应在调查、探 明并编制安全施工方案经监理批准后方可实施，与此相关的费用以及上述资料与现场不符等产生的风险、损失、 责任等均由承包人承担，费用已包含在签约合同价中。”疑问：发包人提供地质及地下管线资料并对其真实性 负责，是法定义务。本条将“资料与现场不符”的全部风险、损失转由承包人承担，等于免除发包人对所提供 商 资料的真实性责任，鼓励发包人提供不实资料而免责，属明显不公平的免责条款。修改建议：发包人应对其提 供的地质及地下管线资料的真实性、准确性负责；因资料与现场不符导致的费用增加和工期延误由发包人承担。 回复：本条款未免除发包人提供工程地质及地下管线基础资料的法定义务，本款是要求承包人在相关资料的基 础上自行现场核实并承担因现场情况与资料不道符所产生的风险与费用，该约定属于合理的风险分配，投标人可 据此自主报价合理考虑风险。故本条款不予修改，请按招标文件执行。 管 问题24.招标文件P124，专用条款3.1.10.5 专款专用“若专用账户资金被司法机关冻结或扣划的，视为挪用资 金……逾期未改正的，发包人有权要求承包人按照签约合同含税总价的10%支付违约金且发包人有权根据实际情 况单方解除本合同。” 疑问：账户资金被司法国冻结、扣划系非承包人主观过错所致，本条视为“挪用资金”并处以签约合同总价10%的 违约金，与承包人实际行为无关，违约金明显畸高。按签约合同总价（而非涉诉金额）计算违约金，远超实际 损失，显失公平。修改建议：仅对承包人主动挪用专项资金的违约行为认定责任；因司法冻结等非承包人原因 不构成违约；违约金以实际损失为限。 中 回复：本条款核心目的是保障项目资金专款专用，确保资金足额用于工程建设，避免因资金问题影响项目进度 与质量，是项目顺利推进的必要约束。承包人作为施工主体，有义务保障项目专用账户资金安全。若因承包人 自身债务、涉诉等原因导致账户资金被冻结扣划，将直接影响项目资金正常使用，破坏了专款专用的核心要求， 该约定属于合同双方合意约束，不属于事实认定错误。故本条款不予修改，请按招标文件执行。 问题25.招标文件P125-126，专用条款3.1.10.16 施工许可证办理“承包人按渝建发〔2008〕177号文规定办理安全手 续。在承包人进场30日内完成施工许可证办理，若因承包人原因造成施工许可证办理延迟，每逾期一日承包人 按5-10万元/天（具体金额由发包人视情况确定无需承包人同意）承担违约责任。”疑问：第一，领取施工许可 证是发包人（建设单位）的法定义务（《建筑法》第7条），承包人仅协助办理；将办证延误责任全归于承包人， 责任主体错误。第二，违约金标准5-10万元/天且金额由发包人单方确定、无需承包人同意，剥夺了承包人协商 权，标准畸高。修改建议：明确施工许可办理责任主体为发包人；承包人协助义务应限定于提供资料等合理范 围；违约金采用固定标准并双方确认，且以实际损失为限。 回复：投标人参与投标，即表明其已对施工许可证办理涉及的法律法规要求、报监手续流程、各方责任边界等 事项进行了充分了解和评估，并在此基础上合理报价。根据《建筑法》第七条规定，建设单位是申请领取施工 许可证的法定主体；本条是针对因承包人原因造成施工许可证办理延迟而设置的管理办法，并非将法定义务转 嫁于承包人，而是对承包人配合义务的对等约束。故本条款不予修改，请按招标文件执行。 问题26、招标文件第三部分专用合同条款 P140中提到的材料及设备参照品牌，投标人是否需要将该表作为附件 附入第八章投标文件格式中资格审查部分中的（三）其他资料？ 回复：不需要 问题27.本项目是否需要投标人填报总承包服务费？若需要请招标人告知填报在何处。 回复：不单列，由投标人综合考虑，包干使用，纳入投标报价 网 问题28.请问招标人本项目有没有设置清单综合单价异常低价警戒线？若单项清单综合单价低于异常低价警戒线， 是否需要单独提供低价合理性说明？ 务 回复：招标人未设置清单综合单价异常低价警戒线。 问题29.低价合理性说明佐证材料，投标人自有采购合同、商劳务协议、设备租赁协议是否可作为有效材料？请明 确有效佐证材料范围及禁用材料标准。 回复：投标人提交的低价合理性说明及相关佐证材料是基于投标人自身企业的实际情况并结合项目具体特点来 提供，最终以评标委员会的评审意见为准。 道 问题30.招标文件中因市场价格波动引起的价格均不调整，人工材料价差均不调整，因本工程工期较长，且近年 管 来建材、人工市场价格波动剧烈，承包人无法在投标阶段准确预判全施工周期的价格走势。若强制约定所有价 差均不调整，将导致承包人投标报价无法合理测算风险成本，报价严重失真，请发包人修改为“人工及材料按 当期《重庆工程造价信息》发布的单价变化超过±5%时调整，调差材料包含：钢材（包含钢筋、钢管、钢板、 型钢、角钢、槽钢、工字钢、钢绞线等）、商品混凝土、预拌砂浆、沥青混凝土、水泥稳定碎石拌和料、水泥、 砂、碎石、电缆等。”国 回复：本项目工期小于一年，价格风险处于行业可预见、可承受的合理范围内。按招标文件要求执行。 中 问题31.投标文件中下划线上、空格处、表格中无需要填写或无法填写内容的，是否可以填“/”或不填(空白)？ 回复：投标文件中下划线上、空格处、表格中无需要填写或无法填写内容的，投标人填“/”或“无”还是不 填(空白)，都可以。 问题32.投标函附录中，分包的约定内容是否可以填写“达到招标文件的要求”即可？ 回复：可以。 问题33.请明确施工临时用电的接口位置及负荷，请明确施工用水的接口位置及管径。 回复：以招标文件为准。 问题34.为便于总进度计划编排，请明确计划开工日期、计划竣工日期。 回复：本项目计划开工日期和计划竣工日期以合同签订后监理人发出的开工通知载明的日期为准。 问题35.重庆市电子招投标系统投标文件-报价部分“己标价工程量清单”-“投标总价”页面招标人名称需要填写 吗？ 回复：页面填写内容以发布的工程量清单为准。 问题36.招标文件第八章投标文件格式中，“资格审查部分（二）承诺”是否包含招标文件中要求的所有承诺， 投标人是否无需提供除此之外的其他承诺？ 回复：招标文件中要求的承诺已在投标文件格式“资格审查部分”的“(二)承诺网”中集中编制，投标人若有其他 承诺，请自行考虑。 务 问题37.招标文件14页“投标总报价异常低价警戒线：16710615.51 元”。请问，投标报价等于16710615.51元是否 会被判定为异常低价？ 回复：不会。根据招标文件约定，投标总报价低于异常低价警戒线的，应提供报价合理性说明。 商 问题38.投标文件制作系统导出的电子投标文件格式与加盖公章的招标文件PDF中的文件格式不一致时，以哪个为 准？ 道 回复：若招标文件中第八章的投标文件格式与制作软件中格式有不一致的情况，则应以加盖电子印章的招标文件 (即 PDF版)为准(除制作软件自动生成无法修改的外)，其制作软件中的格式是为方便投标人编制投标文件使用。 管 问题39.现场递交纸质保函原件是否需要本项目投标人须知前附表中要求的委托代理人持授权委托书和养老保险 证明材料复印件递交？ 国 回复：可不需要。 中 问题40.我单位为中型企业，其控股股东为大企业，但我单位不属于大企业的分支机构，也不存在与大企业的负 责人为同一人的情形。鉴于此种情况，我单位应提供《中小企业声明函（工程类）》还是《中小企业承担合同 额承诺涵》？ 回复：贵司其控股股东为大企业，故需提供中小企业承担合同份额承诺函。 问题41.财务审计报告中的相关财务报表是否需要由单位负责人和主管会计工作的负责人、会计机构负责人（会 计主管人员）签名并盖章；设置总会计师的单位，是否需要由总会计师签名并盖章？ 回复：招标文件对“财务会计报告应当由单位负责人和主管会计工作的负责人、会计机构负责人（会计主管人 员）签名并盖章；设置总会计师的单位，还需由总会计师签名并盖章”未作要求。请投标人根据招标文件要求 提供会计师事务所或审计机构出具的合法有效的财务审计报告及财务报表。最终由评标委员会根据投标人提供 的证明材料并结合招标文件要求进行评审，且招标人有权对投标人提供的资料进行核实，若发现弄虚作假，按 相关规定取消其中标资格，并按相关法律法规处理。 问题42.财务审计报告，是否要求赋码？ 回复：投标人提供的财务报告可不需要赋码； 问题43.2022年、2023年、2024年经审计的年度财务报表不连续亏损。提供 00；热缩管 φ100 米 2000；热缩管 φ80 米 3000。","industry":"市政","industry_source":"rule","engineering_summary":"项目名：中交路建贵阳G320项目波纹管采购公告\n项目内容：本项目是中交路桥建设有限公司G320贵阳竹子坡至大地公路工程两个合同段的波纹管采购项目，涉及的主要内容包括路基工程、桥涵工程、雨污水管网工程、电力综通管网工程、边坡防护工程等。\n资金情况：本项目已获批准建设，建设资金已落实。\n产品种类：塑料波纹管","detail_text":"中交路建贵阳G320项目波纹管采购公告 中交路桥建设有限公司塑料波纹管采购招标公告 招标编号：FA00000680274 1.招标条件 本项目已获批准建设，建设资金已落实。本项目已具备招标采购条件，现对中交路桥建设有限公司G320贵阳竹 子坡至大地公路工程项目经理部施工用塑料波纹管采用电子化公开招标投标方式，招标人为中交路桥建设有限 公司（以下简称招标人） 网 2.项目概况 2.1项目概况： 务 包件1：中交路桥建设有限公司G320贵阳竹子坡至大地公路工程第一合同段项目经理部 ①项目概况：①G320贵阳竹子坡至大地公路工程项目(观山湖段)施工第一合同段，主线起讫桩号 为K0+000～K5+180，路线长5.18km，主要施工内容包括路商基工程、桥涵工程、边坡防护工程等，包含立交2座， 大桥1座，特大桥1座，箱涵3道，主线挖方213.78万方，填方50.29万方。施工属地位于贵州省贵阳市观山湖区， 项目起点接观山湖区现状宾阳大道，设置大地互通立交1座（2634.94m），路线向南延伸，设置龙潭边大桥 （390m），接375m路基，跨越大坪水库上游设置摆狮头特大桥（1622m），连接路基及巩固立交至线路终点。 道 开工日期：2025年6月28日，完工日期2027年6月28日，总计工期24个月。 ②工程所在地点：贵州省贵阳市观山湖区G320贵阳竹子坡至大地公路工程第一合同段项目（如需现场查看请与 项目物资部联系：赵部长 联系电话：17361561205） 管 包件2：中交路桥建设有限公司G320贵阳竹子坡至大地公路工程第二合同段项目经理部 ①项目概况：①G320贵阳竹子坡至大地公路工程项目(观山湖段)施工第二合同段，主线起讫桩号 为K5+180～K11+120，国主要施工内容包括路基工程、桥涵工程、雨污水管网工程、电力综通管网工程、边坡防护 工程等，主要结构物为主线桥梁6座、车行天桥2座及互通一座，路基挖方311万方、路基填方160万方。施工属地 位于贵州省贵阳市花溪区，在K5+053.55处设置分离式桥梁上跨金翁路后，再向南经沙窑冲、土地田进入戈寨村， 并与麦戈公路形成菱形立交，再向南延伸经新寨村、蛤蟆院后设置隧道下穿规划湖林铁路支线，终点接贵安新 区湖磊路（中G320湖磊路段），终点与康寨至麦坪村道形成十型平面交叉。 开工日期：2025年12月30日，完工日期2027年7月30日，总计工期19个月。 ②工程所在地点：贵州省贵阳市观山湖区G320贵阳竹子坡至大地公路工程第二合同段项目（如需现场查看请与 项目物资部联系：赵部长 联系电话：17361561205） 2.22.2招标内容概况： ①本次招标材料为塑料波纹管。 ②本次招标塑料波纹管的各项性能和质量，必须符合《预应力混凝土桥梁用塑料波纹管》JT/T 529-2016的技术标 准、质量要求，及行业相关专业的安全和质量标准;具体质量技术要求详见招标文件第五章《供货要求》。 ③预计供货期间（暂定）：2026年9月30日-2027年7月30日。 3.投标人资格要求 3.1基本条件 （1）在中华人民共和国境内依法注册，具有独立法人资格、具有招标物资生产或供应经验的企业，并且具有合 法、有效的“三证合一”的营业执照。 （2）遵守国家法律、法规，具有良好的信誉；并在人员、设备、资金等方面具备相应的能力； （3）具有履行申请物资供应合同的能力和良好履约记录； （4）具有良好的资金财务状况； 3.2具体条件 （1）营业范围要求：在中华人民共和国境内依法经国家工商、税务机关登记注册，能够独立承担民事责任，具 有独立企业法人资格。 （2）生产能力要求:投标物生产商年生产量必须满足项目生产施工需求，所采用的生产工艺、装备必须符合国家 产业发展政策的相关规定。 网 （3）财务能力要求：投标人具有良好的财务资金状况，资金财务状况良好，具备实施合同前期充足的资金保障 能力，具有近三年经会计师事务所审计的财务报告及报表。（包括但不限于经审计的资产负债表、现金流量表、 利润表和财务情况说明书）。 务 （4）质量保证能力要求:具有近三年内的省、部级及以上专业检测机构出具的针对投
