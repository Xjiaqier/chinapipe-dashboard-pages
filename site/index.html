安市">雅安市</option><option value="宜宾市">宜宾市</option><option value="自贡市">自贡市</option><option value="遵义市">遵义市</option><option value="未识别城市">未识别城市</option></select></div><div class="filter-field" style="flex-direction:row;align-items:center;gap:10px;"><input type="checkbox" id="new-item-filter" style="width:18px;height:18px;cursor:pointer;" /><label for="new-item-filter" style="cursor:pointer;user-select:none;">仅显示新增加项目</label></div></div></div></section><div id="panel-results"></div><div id="load-more-container"></div><script>const panelItems = [{"title":"肖家河污水厂两江新区范围配套污水管网整治工程施工答疑补遗文件","published_at":"2026-08-26","province_name":"重庆市","prefecture_name":"","county_level_name":"","secondary_administrative_name":"","project_content":"肖家河污水厂两江新区范围配套污水管网整治工程","funding_situation":"原文未提及","product_category":"原文未提及","product_usage":"原文未提及","industry":"市政","industry_source":"rule","engineering_summary":"项目名：肖家河污水厂两江新区范围配套污水管网整治工程\n项目内容：肖家河污水厂两江新区范围配套污水管网整治工程\n资金情况：原文未提及\n产品种类：原文未提及","detail_text":"肖家河污水厂两江新区范围配套污水管网整治工程施工答疑补遗文件 各潜在投标人： 现将肖家河污水厂两江新区范围配套污水管网整治工程施工招标答疑发布如下： 一、答疑部分 问题一：1、我公司于2026年进行了优势合并整合，现准备使用合并前公司项目业绩作为本次我司投标的投标人 业绩证明，并提供上级主管单位出具的相关吸收合并文件或两家公司签订的吸收网合并协议，请问是否可视为满 足招标业绩要求？ 2、我单位为中型企业，其控股股东为大企业，但我单位不属于大企业的分支机构，也不存在与大企业的负责人 为同一人的情形。鉴于此种情况，我单位应提供《中小企业声明函（工程类）》还是《中小企业承担合同份额 务 承诺函》？ 回复：1、满足，但还需满足招标文件对业绩的其他要求。最终由评标委员会根据投标人提供的证明材料并结合 招标文件要求进行评审。 商 2、贵司其控股股东为大企业，故需提供中小企业承担合同份额承诺函。 道 问题二：本项目有无业主专家参与评标？ 回复：本项目评标委员会由招标人按法律法规及相关规定依法组建。 管 问题三：1、财务报告可以不提供财务报表附注吗? 2、投标函附录中，工国期、分包、工程质量、缺陷责任期等要求可以统一填写\"达到招标文件要求\"吗? 3、招标文件第八章投标文件格式中(二)承诺部分是否包含招标文件要求的所有承诺，投标人是否还需要提供其 他格式之外的其他承诺? 中 4、是否有业代专家参与评标，不要模糊的回答什么依法组建评标委员会。请明确回复有或者没有。 5、本项目是否异地评标？ 6、业绩竣工验收证明材料中有单位盖的项目部章是否认可呢？ 回复：1、可以不提供财务报表附注。 2、可以统一填写\"达到招标文件要求\"。 3、本项目招标文件中要求的承诺已在投标文件格式“资格审查部分”的“(二)承诺”中集中编制，投标人若有 其他承诺，请自行考虑。 4、本项目评标委员会由招标人按法律法规及相关规定依法组建。 5、本项目采用异地评标。 6、业绩竣工验收证明材料盖项目部章不予认可。 问题四：请问xxxx现在被人民法院列为被执行人且有1000多万股权冻结到2028年，因为不能履行保函的见索即付， 拒绝赔付。 相关业主方在招标文件补遗通知中直接将xxxx列入担保公司回避名单，拒绝xxxx所出具的保函。由此可见xxxx的 信用资质、履约能力、根本无能力是存在很大问题的。请问以xxxx目前的被执行和不履行投标担保责任的情况是 否符合招标文件的要求? 回复：纸质投标保函的开立人应当是具有相应资格的银行、保险机构、融资担保公司，其信用资质、履约能力、 担保能力、赔付流程、安全保密等应符合工程保函业务条件。纸质投标保函应合法合规，符合招投标行政监督 部门、行业主管部门和金融监管部门的相关规定，满足招标文件约定要求。投标人应选择在渝依法设立总部或 者设有分支机构的金融机构开具纸质投标保函。投标人对所提交的纸质投标保函的真实性、合法性、有效性负 责。以纸质投标保函形式交纳投标保证金是否符合招标文件要求，由评标委员会评标时，根据招标文件要求进 行独立评审，并作出相应评审判断。 网 问题五：我公司业绩合同金额3800万元及以上，但是竣工报告业绩金额小于3800万元，请问是否满足业绩要求？ 务 回复：招标文件已明确当业绩证明材料中针对同一指标存在不一致时，以工程竣工验收合格的证明材料为准。 故竣工报告业绩金额小于3800万元不满足业绩要求。 商 问题六：招标文件第八章投标文件格式中（二）承诺部分是否包含招标文件要求的所有承诺，投标人是否还需 要提供其他格式之外的其他承诺？ 道 回复：本项目招标文件中要求的承诺已在投标文件格式“资格审查部分”的“(二)承诺”中集中编制，投标人若 有其他承诺，请自行考虑。 管 问题七：专业分包业绩满足业绩要求吗？ 回复：满足，但还需满国足招标文件对业绩的其他要求。 中 问题八：请问投标文件制作系统软件导出的电子投标文件格式与加盖公章的招标文件PDF文件中的投标文件格式 不一致的以哪个为准？ 回复：若招标文件中第八章的投标文件格式与新点制作软件中格式有不一致的情况，则应以加盖电子印章的招 标文件（即PDF版）为准（除新点制作软件自动生成无法修改的外），其新点制作软件中的格式是为方便投标人 编制投标文件使用。 问题九：投标文件格式中下划线上、空格处、表格中无需要填写或无法填写内容的，是填“/”或“无”还是可 以不填(空白)，对此有无要求？ 回复：均可未作要求，由投标人自行考虑。 问题十：乡、镇供水厂及供水管道业绩满足业绩要求吗？ 回复：满足，但还需满足招标文件对业绩的其他要求。 问题十一：招标人应当在法定时间内确定中标人。招标人或者招标投标交易场所运行服务机构应当在中标通知 书发出后 5 日内，向除中标人以外的其他投标人退还纸质投标保函正本，并书面通知相关金融机构本项目准予 提前注销纸质投标保函。具体注销事宜由投标人与金融机构协商。保函原件上需要加盖正本吗？ 回复：纸质投标保函原件上未加盖“正本”字样的，不因此否决投标，但投标人应确保提交的保函为唯一正本。 若因保函真伪问题导致的一切不利后果由投标人自行承担。 问题十二：1.老旧小区室外环境改造业绩满足吗？ 网 回复：不满足。 2.自来水厂或者净水厂施工业绩满足业绩要求吗？ 务 回复：满足，但还需满足招标文件对业绩的其他要求。 3.污水处理厂提标改造施工业绩满足吗？ 回复：满足，但还需满足招标文件对业绩的其他要求。商 4.市政桥梁施工业绩符合吗？ 道 回复：满足，但还需满足招标文件对业绩的其他要求。 管 5. 公园施工业绩满足吗？ 回复：公园概念过于宽泛，无法判定该施工业绩是否属于市政工程，请投标人自行核实，并按招标文件要求提 供业绩证明材料，其是国否满足要求应由评标委员会根据证明材料具体内容进行判定。 问题十三：任一清单的综合单价低于警戒线，就要提供说明吗？ 中 回复：本项目未对工程量清单综合单价作出异常低价警戒线要求。 问题十四：财政部 国务院国资委 金融监管总局2023年9月14日发布的《关于加强审计报告查验工作的通知》 中要求会计师事务所应当按照规定将其承办《中华人民共和国注册会计师法》第十四条规定审计业务出具的报告 （以下简称审计报告）上传注册会计师行业统一监管平台（以下简称统一监管平台）并申请赋码。本项目投标 人提供的财务报告需要赋码和提供深度查询截图吗？ 回复：投标人提供的财务报告不需要赋码和提供深度查询截图。 问题十五：招标人提供的工程量清单单项最高限价中金额为零的，清单综合单价报价可以为0吗？ 回复：根据招标文件“投标人的工程量清单单项报价不得为零报价（招标人提供的工程量清单单项最高限价中 金额为零的除外）或者负数报价”，招标人提供的工程量清单单项最高限价中金额为零的，该项清单综合单价 报价可以为0。 问题十六：有人提出一个无关问题。 回复：无关问题不予回复。 问题十七：业绩要求的竣工时间是指竣工验收时间吗？ 回复：本项目业绩要求所指竣工时间，即为工程竣工验收合格证明载明的竣工验收时间。 问题十八：本项目是异地评标吗？ 网 回复：本项目是异地评标。 务 问题十九：我公司业绩为三个项目合并招标，三个项目合起来满足业绩要求，但分别签了三个合同和分别验收， 请问我公司业绩满足业绩要求吗？ 回复：不满足。 商 问题二十： 道 1.财务报告可以只提供审计报告、现金流量表、资产负债表、利润表吗？ 回复：按照招标文件要求“提供：会计师事务所或审计机构出具的合法有效的财务审计报告及财务报表，财务 管 报表须至少包括现金流量表、资产负债表、利润表”。 2.投标函中的缺陷责任期可以填“达到招标文件的要求”吗？ 回复：可以填“达到招国标文件的要求”。 3.现场递交纸质保函原件是否需要本项目投标人须知前附表中要求的委托代理人持授权委托书和养老保险证明材 料复印件递交吗？ 中 回复：递交纸质保函原件无需提供投标单位授权委托书及本人身份证明。 4.有人提出一个无关问题 回复：无关问题不予回复。 问题二十一：在职的已退休的注册人员，其社保局出具的养老证明已无法提供，该类人员是否可以用退休证、 注册证及在本单位注册的证明文件替代？ 回复：退休人员不符合本项目对投标人相关人员的要求，必须按招标文件要求提供相关人员的养老保险证明。 问题二十二：我公司业绩为epc业绩，我公司与设计单位组成联合体承接，竣工验收报告中施工单位盖章由我公 司盖章，请问需要提供联合体协议书吗？ 回复：若投标人提供的公司业绩为epc业绩，且合同协议书或工程竣工验收合格的证明材料或业主证明能证明该 投标人承担的工作为施工任务的，则不需要提供联合体协议书；若投标人提供的公司业绩为epc业绩，但合同协 议书或工程竣工验收合格的证明材料或业主证明不能证明该投标人承担的工作为施工任务的，则需要提供联合 体协议书。 问题二十三：可以用自己做的材料购买协议、劳务协议、设备租赁协议作为低价说明证明材料吗？ 回复：投标人投标总报价低于招标文件规定的对应的异常低价警戒线的，应提供报价合理性说明，并提供必要 的证明材料。证明材料由投标人自行提供，但提供的说明不得降低或者改变原设计方案、技术工艺、施工标准， 不得影响项目的质量、安全、工期、结算等正常履约。 问题二十四：有人提出一个无关问题。 回复：无关问题不予回复。 网 务 招标人：重庆水务环境控股集团管网有限公司 商 招标代理机构：重庆市投资咨询有限公司 2026年8月26日 道 信息来源:https://www.chinapipe.net/project/d3081038.html 管 cqdingjiu 2026.08.26 17:19:19 国 中","detail_url":"https://www.chinapipe.net/project/d3081038.html","match_score":0,"matched_keywords":["肖家河污水厂","两江新区","配套污水管网整治工程"],"isNew":true},{"title":"重庆市潼南区提升农村饮水质量工程(潼南区农村供水保障工程)第二批勘察设计答疑补遗文件","published_at":"2026-08-26","province_name":"重庆市","prefecture_name":"","county_level_name":"潼南区","secondary_administrative_name":"潼南区","project_content":"本项目涉及农村供水保障工程的勘察设计工作。","funding_situation":"原文未提及","product_category":"勘察设计服务","product_usage":"原文未提及","industry":"市政","industry_source":"rule","engineering_summary":"项目名：重庆市潼南区提升农村饮水质量工程(潼南区农村供水保障工程)第二批勘察设计\n项目内容：本项目涉及农村供水保障工程的勘察设计工作。\n资金情况：原文未提及\n产品种类：勘察设计服务","detail_text":"重庆市潼南区提升农村饮水质量工程(潼南区农村供水保障工程)第二批勘察设计答疑补遗文件 各潜在投标人： 现就对重庆市公共资源交易网发布的《重庆市潼南区提升农村饮水质量工程（潼南区农村供水保障工程）第二 批勘察设计》招标文件作如下补遗： 1、本项目开标时间、投标截止时间及保证金递交截止时间修改为：2026年10月15日9时30 分。 招标人：重庆市潼南区水务（集团）有限公司 网 招标代理机构：重庆精聚达项目管理有限公司 2026年8月26日 务 信息来源:https://www.chinapipe.net/project/d3081033.html cqdingjiu 2026.08.26 17:19:20 商 道 管 国 中","detail_url":"https://www.chinapipe.net/pro 131 个月，2021年12月1日进场开工，2032年11月8日全部竣工。 1.2询价内容 详见拟采购货物一览表 二、供应商资格要求 2.1供应商必须是“中国铁建云链平台”注册并通过审核的供应商。 2.2本次询价采购不接受被列入“2026年中国铁建合作方风险警示名录”中的供应商。 2.3供应商在报价时，如是法定代表人签字的需提供法定代表人身份证复印件、如是法人授权代理人签字的需提 供授权委托书及被授权人身份证复印件。 2.4询价响应供应商需提供营业执照复印件。 2.5其它要求：供应商存在单位负责人为同一人或者存在直接控股、管理关系的不同供应商，不得同时参与本次 询价采购活动。供应商须如实披露关联关系，若隐瞒关联关系，一经查实，报价无效。 三、拟采购物资及相关要求 3.1拟采购物资一览表 网 务 序号 包件号 物资名称 型号规格 单位 数量 项名称 交货地址 交货日期 1 金属波纹管 内径φ100、外径φ107 M 14700 四川省甘孜州雅江县 2 JSBWG-01 接头套管 内径φ110、外径φ117 个 3400 CZ8标 新建CZ铁路雅安至林 2026.9.4- 商 三工区 芝段CZSCZQ-8标段项 2027.9.8 外径φ110、壁厚3-4mm 3 内衬管 m 1680 目三工区项目部 白色PE管 道 3.2技术规格书： 管 （一）金属波纹管技术要求：金 属 波 纹 管 应 符 合 《 预 应 力 混 凝 土 用 金 属 波 纹 管 》 （ JG2 25 一 2020 ）的 要 求 。 （二）管道形成:预应力国钢束孔道采用金属波纹管成孔，金属波纹管应符合《预应力混凝土用金属波纹 管》(JG225-2020)的要求。 2.1构造与尺寸要求 中 1、波纹旋向宜为右旋；折叠咬口重叠宽度≥钢带厚度 8 倍，且≥2.5mm；波纹波峰、波根圆弧过渡，不得有硬 折角。 2、内径偏差：圆管公称内径≤50mm：±0.5mm；＞50mm：±1.0mm；扁管长、短轴符合标准允许偏差。 3、管体顺直，局部扭曲、椭圆度满足规范；切口平整，管口无毛刺飞边，防止划伤钢绞线。 4、接头套接：套接长度≥300mm，套接牢固，缝隙密封，不得漏浆。 2.2外观质量 1、管内外清洁，无孔洞、裂纹、锈蚀、油污、不规则褶皱。 2、咬口严密，无开裂、脱扣、松卷散口。 3、镀锌层完整，无起皮、大面积浮锈。 （二）投标人应提供的技术资料 1、提供产品合格证、出厂检测报告等有效资料。 2、提供产品合格证。 3、提供配件参数及设备适配说明，确保可现场直接互换使用。 （三）合同交货计划： 交货周期：根据现场施工进度，按需分批供货，供货批次、数量以招标人通知为准，供货明细详见采购清单。 （四）投标物资详细的运输和供应方案 送货至项目指定地点，供方承担全程运输、装卸及货损责任。 网 （五）验收要求 1、资料齐全，合格证、清单、检测资料匹配一致。 务 2、配件外观完好、规格型号符合清单及国标标准。 3、现场装机适配、运行稳定、无故障、无渗漏即为验收合格。 商 4、不合格产品供方无条件退换，并承担全部费用及损失。 3.3结算和付款 道 3.3.1采购物资报价规则： 固定价格 管 3.3.2付款方式 （1）货款支付方式： □银行转账（ %） 铁建云信（ 100 %），国兑付期限为： 6 个月 □银行承兑汇票（ %），兑付期限为： 个月 □商业承兑汇票（ %），兑付期限为： 个月 中 □其他 （ %） 票据贴息费用由 承担。 （2）付款周期：买方在双方对账结算并收到正规有效的增值税专用发票之日起 90 天内支付该批物资货款金额 的 70 % ，180天内支付至 100%。延期付款宽限期7个工作日。 （3）逾期付款约定：如发生逾期付款，逾期支付利息=未付款货款金额×逾期资金占用费率。逾期资金占用费 率以同期一年期LPR为基准，具体执行采购人与供应商双方协商确定。 3.4拟采购物资相关的要求 3.4.1本次询价为整体采购，询价响应供应商报价时须写明单价、到站价和运距，报价包含货物制造、运输、装卸、 售后服务等交付采购人使用前所有可能发生的费用，收到报价后不再增补任何费用。 3.4.2交货期：按照采购人规定的期限内全部运抵交付。 3.4.3供货地点：四川省甘孜州雅江县。 3.4.4询价响应供应商必须提供产品的质量保证说明及售后服务承诺。询价响应供应商提供的货物制造标准及技术 规范等，必须符合最新相关国家标准、部颁标准相关标准和规范的要求，并且提供相关检验检测报告。 3.4.5采购方在确定成交供应商后有权对成交产品的结构、规格做适当调整，调整内容将以工作联系函形式提前发 至供应商。 3.4.6售后服务：本批采购货物若在验收阶段出现不符合规格或质量标准，供应商必须接受退货要求，并在采购人 规定 非标弯头,法兰,三通,四通,闸阀","detail_text":"中铁十七局集团有限公司羊皮坝磷石膏堆场无害化贮存改造项目排水网、波纹管及配套闸阀采购招标公告 1. 招标条件 本次招标项目为中铁十七局集团有限公司羊皮坝磷石膏堆场无害化贮存改造项目经理部，工程已由川投资备 【2507-511726-99-02-657270】JXQB-0121号批准建设，建设单位为：瓮福达州化工有限责任公司，建设资金来自 瓮福达州化工有限责任公司投入资金，建设资金已落实。已具备采购条件，现进行公开招标采购。 2. 项目概况与招标内容 2.1项目概况 网 项目位于四川省达州高新区羊皮坝磷石膏堆场。羊皮坝磷石膏堆场无害化磷石膏与原磷石膏的隔离改造、新增 无害化磷石膏堆积坝、排渗系统、排洪系统、监测系统改造及膜的第三方完整性检测等。 务 2.2.1 招标内容及包件划分：详见招标公告附件1《招标物资包件清单》，本次招标一包一投。 2.2.2 方式：采用公开招标方式。 3. 招标依据 商 3.1本次招标组织单位的依据为： （1）《中华人民共和国招标投标法》； 道 （2）《中华人民共和国招标投标法实施条例》（国务院第613号令）； （3）《工程建设项目货物招标投标办法》（国家发展改革委等七部委令第27号）； 管 （4）《评标委员会和评标方法暂行规定》（国家发展改革委等七部委令第12号）； （5）《铁路工程建设项目招标投标管理办法》（交通部13号令）（仅适用于铁路项目）； 国 （6）《中国铁建股份有限公司物资采购管理规定（试行）》（中国铁建供应链〔2025〕106号）； （7）《中铁十七局集团有限公司物资管理办法（暂行）》（公司物资〔2023〕298 号）； 中 （8）《中铁十七局集团有限公司物资采购管理办法（暂行）》（公司物资〔2023〕299 号）； （9）其他相关法律、法规、规章。 4. 投标人资格审查及要求 4.1 本次招标资格审查采用资格后审的方式。 4.2 本次招标要求投标人须具备以下条件： （1）营业范围：在中华人民共和国境内依法注册，公司成立时间须满1年以上（生产商除外），具有独立法人资 格、具有招标物资生产或供应经验的贸易商或生产商，并且具有合法有效的营业执照，注册资金不低于100万； （2）许可和认证要求：营业执照经营范围内可供应拟招标物资； （3）生产能力：报价人需为生产企业或经销商，所提供的产品和服务必须保证用于本工程的技术完整性； （4）财务能力：投标人有依法纳税的良好记录；须提供投标人近两年（2023-2025年）财务报告及相关报表，期 间注册的新公司须提供成立后的财务报表；投标人具有良好的财务状况、具备投标包件履约的资金保障能力。 （5）质量保证能力：产品符合国家现行标准；报价产品须取得有资质认定专业检测机构出具的近两年投标物资 质量检验报告至少一份； （6）供货业绩：须提供投标人近三年(2023-2025年)招标物资在同类工程项目或国内重点工程建设项目供货业绩 证明（须提供合同复印件，必要的话需提供原件，合同时间以合同签订日期为准）； （7）履约信用：近两年无因自身履约问题而引起的法律诉讼、没有与骗取合同有关的犯罪或严重违法行为，近 两年内没有被处以责令停业、暂停报价、财产被接管、冻结、破产状态等，不在招标项目行业主管部门限制投 标的处罚期内、投标人在近两年内未被人民法院列为失信被执行人、不在最新一期《中国铁建合作方风险警示 名录》以及被招标组织单位列为风险警示合作名录的供应商范围内，且在铁建云链系统-供应商详细信息中-准入 及信息评价中不得出现不合格情况，“不得被“信用中国”等国家网站平台列入违法失信企业或失信被执行人 名单等此类情况（在评标期间尚未解除的）”；接受国铁集团物资供应商信用评价管理； 公司近3年不存在虚开发票、偷税漏税、欠税失信等不良记录；公司上年度纳税网信用等级须B级以上，并附信用 等级截图。 （8）其他要求：1、不接受联合体投标；两个及两个以上投标人在同一包件存在法定代表人为同一人，或母公司、 全资子公司及其控股公司关系，都不得在同一包件中同时投标。投标人如是代理商，须提供生产厂出具的授权 务 函或投标物资生产厂销售代理证明，生产厂家不得与其所授权的代理商共同参与同一包件的投标；本次招标资 格审查采用资格后审的方式。 5．招标文件的获取 商 5.1凡有意参加投标者，请登陆中国铁建云链平台（www.crccep.cn）注册会员，查询 拟参与投标包件进行网上报名、支付标书费、下载电子招标文件。 道 5.2招标文件售卖时间为：2026年8月27日8时00分-2026年9月1日18时00分。 潜在投标人须在招标文件售卖截止时间前完成中国铁建云链平台（www.crccep.cn）注册报名，并申请办理CA锁 用于电子投标
