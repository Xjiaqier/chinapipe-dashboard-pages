成的损失由询比响应人承担。 7、付款方式 网 采购方以银行转账或一年期以内（含一年）的商业汇票、应收账款电子凭证、信用证、反向保理等非现金（采 购方承担贴息费用）支付方式向供应商支付货款。 务 每月1日至本月末为一个统计月。供应商将上月1日至上月末(遇采购人假期则顺延)内所送货物的送货单(供货方 保存联)汇总后向采购人指定人员提交对账清单，对账无误，双方确认后，供应商持本期全额增值税专用发票和 《材料结算单》到采购人办理本期结算款，待采购人收到业主当月（当月指项目向业主申请本月工程款，例如4 月份申请4月工程款）工程款后，20个工作日内办理本期结算款70%的付款手续，完工结算完成后支付至85%，待 工程完工结算审计后，12个月内付至结算款的 95%，剩余商5%作为质量保证金，质保期为1年，期满30日内质保金 由采购人方扣除因材除料质量问题而发生的费用后一次性返还。 8、履约担保 道 履约担保的形式：履约保证金或履约保函。 签订合同前卖方须向买方提交合同总金额3%的履约担保。履约担保可以采用银行保函/保证金的形式，受益人为 买方。履约保证金若在中标通知书发布后1月内未及时递交，视为卖方自动放弃本次合同履约，响应保证金不予 管 退还。 履约保证金的有效期： 卖方应保证履约保证金国自本合同生效之日起至买方结清全部合同价款之前一直有效。 履约保证金将在合同履行完毕1个月后（办完结算手续30日内）退还至供应商。 履约保证金有效期内，如卖方违约或发生因卖方责任给施工造成经济损失的，买方将从卖方供货款和履约保证 中 金中，直接扣除违约金以及买方应承担的赔偿经济损失的费用。 履约担保的退还或不予退还并不免除供应商对已交付物资的质量保证责任。 三、供应商资格要求 供应商必须满足以下全部资格要求： 1、供应商为生产厂家的，必须是在中国境内注册的企业法人，具有有效期内的ISO9001质量管理体系认证证书。 产品取得第三方产品检验检测机构（省级或国家级）出具的检测报告。 2、供应商为代理商的，必须是在中国境内注册的企业法人，必须具有生产厂家的授权代理书，且其代理的生产 厂家须满足第1条生产厂家资格条件的要求。 生产企业及其代理商不得同时参加。 3、供应商是增值税一般纳税人，能开具增值税专用发票。 4、供应商应具有类似工程的供货业绩（或注明工程类别），在近3年内的供货合同不少于3个，且签订单项合同 金额均在200万元以上（附合同扫描件或中标通知书）。 5、供应商财务状况良好，没有处于被责令停业，财产被接管、冻结、破产状态。 6、本次采购不接受联合体报价。 四、采购文件的获取 凡有意参加报价者，请于请于2026年9月8日前（北京时间）在中国电建采购招标数智化平台 （https://bid.powerchina.cn/bidweb/#/login，以下简称“采购平台”）获取采购文件，采购文件免费提供。 五、响应文件的递交 1、响应文件递交的截止时间（响应截止时间，下同）为2026年9月9日10时00分（网北京时间），供应商应在截止 时间前通过采购平台递交电子响应文件。 （1）本次采购将通过采购平台全程在线开展，电子响应文件的加密、提交等流程须各供应商在线进行操作。供 应商须提前办理数字证书用于在线递交响应文件，办理方式详见采购平台首页，并严格按照要求进行在线操作， 务 因操作流程失误造成的递交失败将由供应商自行承担后果。 （2）开启由“采购平台”在响应截止时间后自动对各家响应文件进行解密，供应商及时关注开启结果。 2、响应文件递交截止时间及递交地点如有变动，采购人商将及时以书面形式通知所有已获取采购文件的供应商。 六、发布公告的媒介 道 本次询比采购公告在中国电建阳光采购网（http://bid.powerchina.cn)上发布。 七、联系方式 管 采 购 人：中国电建市政建设集团有限公司轨道工程公司 地址：天津市西青区华苑产业区榕苑路2号海益国际4号楼 邮编：300384 国 联 系 人：李国栋 电话：15153423756 中 电子邮箱：121924234@qq.com 采购代理机构：中国电建市政建设集团有限公司轨道工程公司设备物资采购领导小组办公室 地址：天津市滨海高新区华苑产业区(环外)海泰发展五道2号 邮编：300384 联 系 人：李国栋 电话：15153423756 电子邮箱：121924234@qq.com 八、提出异议的渠道和方式 电话：15153423756 电子邮箱：121924234@qq.com 九、纪检监督机构 供应商或者其他利害关系人认为本次采购活动存在违规违纪行为的，可以书面形式向中国电建市政建设集团有 限公司纪委办公室（022-58125624）提出投诉。 2026年08月26日 信息来源:https://www.chi
