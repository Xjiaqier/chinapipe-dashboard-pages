请问以重 庆双业融资担保有限公司目前的被执行和不履行投标担保责任的情况是否符合招标文件的要求？ 答：投标保函应合法合规，符合招投标行政监督部门、行业主管部门和金融监管部门的相关规定，并满足招标 文件要求。 务 问题2：任一清单的综合单价低于警戒线，就要提供说明吗？ 答：任一清单综合单价报价低于招标文件规定的对应的异常低价警戒线的，应提供报价合理性说明，并提供必 要的证明材料。 商 问题3：投标文件格式中下划线上、空格处、表格中无需要填写或无法填写内容的，是填“/”或“无”还是可以 不填(空白)，对此有无要求？ 道 答：可以填写“/”或“无”。 问题4：请问招标人是否委派业主专家参与评标吗？ 管 答：本项目由招标人按法律法规及相关规定依法组建评标委员会，不委派招标人代表参与评标。 问题5：招标人提供的工程量清单单项最高限价中金额为零的，清单综合单价报价可以为0吗？ 答：投标人的工程量清国单单项报价不得为零报价（招标人提供的工程量清单单项最高限价中金额为零的除外） 或者负数报价。 问题6：本项目是异地评标吗？ 中 答：本项目是远程异地评标。 问题7：投标人投标总报价或者部分单项报价低于招标文件规定的对应的异常低价警戒线的，投标人未提供报价 合理性说明或者提供的说明不能证明其报价合理性的，由评标委员会作否决投标处理。部分单项报价是指单项 工程的合价低于警戒线提供合理说明还是清单综合单价低于警戒线提供合理说明呢？ 答：投标总报价或任一清单综合单价报价低于招标文件规定的对应的异常低价警戒线的，应提供报价合理性说 明，并提供必要的证明材料。 问题8：投标函中的缺陷责任期可以填“达到招标文件的要求”吗？ 答：可以。 问题9：有没有人行贿专家，有的话我们就不参加了。 答：本项目面向社会公平、公正、公开招标，欢迎社会各界的监督。 问题10：招标人应当在法定时间内确定中标人。招标人或者招标投标交易场所运行服务机构应当在中标通知书发 出后 5 日内，向除中标人以外的其他投标人退还纸质投标保函正本，并书面通知相关金融机构本项目准予提前 注销纸质投标保函。具体注销事宜由投标人与金融机构协商。保函原件上需要加盖正本吗？ 答：纸质保函原件上需要加盖正本。 问题11：招标文件第八章投标文件格式中（二）承诺部分是否包含招标文件要求的所有承诺，投标人是否还需要 提供其他格式之外的其他承诺？ 答：招标文件第八章投标文件格式中（二）承诺部分包含了招标文件所要求的承诺，投标人可根据自身情况提 供格式之外的其他承诺。 问题12：现场递交纸质保函原件是否需要本项目投标人须知前附表中要求的委托代理人持授权委托书和养老保险 证明材料复印件递交吗？ 答：不需要。 网 问题13：请问投标文件制作系统软件导出的电子投标文件格式与加盖公章的招标文件PDF文件中的投标文件格式 不一致的以哪个为准？ 答：以投标文件制作系统软件导出的电子投标文件格式为准。 务 问题14：在职的已退休的注册人员，其社保局出具的养老证明已无法提供，该类人员是否可以用退休证、注册证 及在本单位注册的证明文件替代？ 答：若确认该人员已依法办理退休手续，与任何单位均不商存在全日制劳动关系，不涉及社会保险双重缴纳或劳 动关系冲突，且与投标人单位“退休返聘人员”的身份具有合法性，其从业资格有效性能保障项目履约。可同 时提供以下证明材料替代： （1）《退休证》或《退休审批表》原件扫描道件 （2）身份证原件扫描件 （3）有效的执业注册证书及在本单位的注册证明材料（如注册系统截图、注册变更记录等） 管 （4）投标单位与该人员签订的《退休返聘协议》或《劳务合同》原件扫描件 （5）该人员签署的《承诺书》，内容包括但不仅限于: 国 ① 承诺其已从[原单位名称]正式退休，退休时间为[XXXX年XX月]。 ② 承诺与原单位及任何其他单位均不存在全日制劳动关系及社保冲突。 中 ③ 承诺所提供的所有替代证明材料真实、有效，如有虚假，愿意承担由此引起的一切法律责任，包括但不限 于投标（中标）无效、列入失信名单等。 问题15：可以用自己做的材料购买协议、劳务协议、设备租赁协议作为低价说明证明材料吗？ 答：报价合理性说明提供的证明材料，须具有相关性，有效性，真实性，合法性，请各潜在投标人结合招标文 件要求，自行考虑。 问题16：现在除了没有警戒线和技术方案的低价项目评标专家不被围猎，哪个项目不围猎评标专家，请问招标人 如何保证公平？ 答：本项目面向社会公平、公正、公开招标，欢迎社会各界的监督。 问题17：投标函附录中，工期、分包和工程质量要求对应的约定内容，可以统一填写“达到招标文件要求”吗？ 答：可以。 备注：已发出的招标文件若与本次发布的答疑通知内容有不一致的地方，以本次发布的答疑通知内容为准，不 管下载与否都视为潜在投标人全部知晓有关招投 烯（改性无水磷石膏）双波峰增强排水管混凝土包封","detail_text":"贵阳高新区麦架河生活污水管网提升改造项目设计施工总承包招标公告 1、招标条件 本招标项目贵阳高新区麦架河生活污水管网提升改造项目设计施工总承包已由贵阳国家高新技术产业开发区产 业发展局以 关于贵州高科城市开发集团股份有限公司“贵阳高新区麦架河生活污水管网提升改造项目”初步设 计的批复,“筑高新产项[2025]315号”批准建设，招标人（项目业主）为贵阳高科城市运营服务有限公司 （代建 单位）、贵州高科城市开发集团股份有限公司（建设单位），建设资金来自 财政 ，项目出资比例为 政府投 资：100%。 项目已具备招标条件，现对该项目进行公开招标。 2、项目概况与招标范围 2.1项目总投资：5670.02万元，本标段合同估算金额为：约44165591元（其中设计费500836元，施工费43664755 元）。 2.2建设地址：贵阳国家高新区沙文生态科技产业园。 2.3建设规模：新建网DN500-DN800聚乙烯（改性无水 磷石膏）双波峰增强排水管混凝土包封约7450米，与现有污水管网连通，采用聚乙烯（改性无水磷石膏）双波峰 增强排水管混凝土包封方式改造污水管网约3000米，新增污水检查井248座。 2.4计划工期：总工期24个月（设计 期1个月；施工期23个月）。 2.5招标范围：本项目包含苏庄大沟（海马洞小河）、斑竹大沟（大尖坡小河）等污 水管网进行改建和治理。完成本项目范围内的施工图设计和施工工作，含施工图概算或工程经济指标、施工图 务 设计及送审，并按照审核通过的施工图完成施工及采购，项目完工后由施工单位出具完整的检测报告，直至完 成竣工验收、整体移交、质量保修责任期内的缺陷修复保修等相关工作。 3、投标人资格要求 3.1项目要求申请人具备下述①、②的资质要求 ：①具备建设行政主管部门核发的市政行业（排水工程）专业乙 商 级及以上设计资质。②具备建设行政主管部门核发的市政公用工程施工总承包二级及以上资质，同时具备有效 期内的安全生产许可证，并在人员、设备、资金等方面具备相应的能力。 3.2项目负责人资格：项目负责人须具备①项目经理须具备市政公用工程专业二级及以上注册建造师资格，具备 有效的安全生产考核合格证（B类），在投标截止日前未在其他在建建设工程（含已经获得中标通知书未开工） 担任项目负责人（项目经理，包括工程总承包道中的施工项目负责人）。②施工项目负责人须具备市政公用工程 专业二级及以上注册建造师资格，具备有效的安全生产考核合格证（B类）。③设计项目负责人须具备注册公用 设备工程师（给水排水）资格。④项目经理、施工项目负责人可以为同一人，项目经理（施工项目负责人）与 设计项目负责人不可以为同一人。 3.3本次招标接受联合体投标。联合体投标的，应满足下列要求：①联合体成员不超过2家，各成员应为独立法人， 管 并提供有效期内的营业执照及资质证书。 ②联合体牵头单位须具备建设行政主管部门核发的市政公用工程施工 总承包二级及以上资质。 ③项目经理须为联合体牵头单位在职员工。 ④联合体各方必须签订联合体协议书，明 确联合体牵头单位和各方的权利义务，联合体牵头单位须代表联合体在投标、签约与履行合同中承担其义务和 法律责任。 ⑤联合体各方没有被暂停或取消投标资格或被有关部门通报在招投标过程中有违法行为。 ⑥联合体 国 各方不得再以自己名义单独或加入其他联合体在本招标项目中参加投标。 ⑦如联合体成员具有相同专业资质， 且联合体协议书有明确分工的，按其分工确定相应专业的资质等级。 ⑧联合体中标的，联合体应当共同与招标 人签订合同，就中标项目向招标人承担连带责任。 3.4各申请人均可就上述标段提出投标申请。 4、招标文中件的获取 凡有意参加投标者，请于2026年08月26日至2026年09月24日,贵阳市公共资源交易中心网站下载（系统使用咨询电 话：0851-84839750、编标工具咨询电话：0851-84839750，交易中心网址：http://ggzy.guiyang.gov.cn） 5、投标文件的递交 5.1投标文件递交的截止时间为2026年09月28日 09:30，通过贵阳市公共资源电子交易系统递交（网 址http://222.85.190.33:82/TPBidder/memberLoginForJsgc） 5.2未在贵阳市公共资源交易中心系统成功上传的电子投标文件，招标人不予受理。 6、发布公告的媒介 本次招标公告同时在全国公共资源交易平台 ( 贵州省·贵阳市)（工程建设类）、贵州省招标投标公共服务平台 上发布。 7、行政监督部门 本次招标的监督部门：贵阳市国家高新技术产业开发区建设工程招标投标办公室。 地址：贵阳市观山湖区阳关大道100号贵阳国家
