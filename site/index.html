2158㎡。\n资金情况：项目业主为成都交投置业有限公司，建设资金来自国家投资-非政府投资，项目出资比例为100%。\n产品种类：场地整理、乔灌木、草坪及养护等，地下管网、给排水、强弱电安装等，场内园路、网球场及附属设施等。","detail_text":"2025年“两拆一增”成华区东华丛树片区美丽街角提升改造工程项目施工/标段招标公告 1．招标条件 1.1本招标项目2025 年“两拆一增”成华区东华丛树片区美丽街角提升改造工程项目施工 / 标段已由成华区行 政审批局以川投资备【2508-510108-04-01-382776】第FGQB-0311号批准建设，项目业主为成都交投置业有限公司， 建设资金来自国家投资-非政府投资，项目出资比例为100%，招标人为成都交投置业有限公司。项目已具备招标 条件，现进行公开招标。 1.2本招标项目由成华区行政审批局核准（招标事项核准文号为川投资备【2508-网510108-04-01-382776】 第FGQB-0311号）的招标组织形式为委托招标。招标人选择的招标代理机构是中化商务有限公司。 本标段行政监督部门为成都市成华区住房建设和交通运输局，采用“评定分离”方式进行评标定标。 务 2．项目概况与招标范围 2.1建设地点：成都市成华区丛树东华片区三环路以西；商 2.2建设规模：该项目包含 5 个点位的美丽街角建设任务，分别为：1、东华 5 号规划路侧绿地项目，增绿面积约 967㎡；2、东华 6 号规划路侧绿地项目，增绿面积约为 1007㎡；3、丛树 1 号规划路侧绿地项目，增绿面积约为 2480㎡；4、东华 7 号规划路侧绿地项目，增绿道面积约为 11298㎡；5、民兴北一路西侧规划绿地项目，增绿面积 36406㎡（其中包含建设 8 片网球场）；总增绿面积约为 52158㎡。 2.3计划工期：245个日历天； 管 2.4招标范围：场地整理、乔灌木、草坪及养护等，地下管网、给排水、强弱电安装等，场内园路、网球场及附 属设施等。2025年“两拆一增”成华区东华丛树片区美丽街角提升改造工程项目施工图所示范围内和已标价的工 程量清单范围内涉及本项目工程施工的全部工作。 2.5质量要求：工程质量国符合国家现行有关工程施工质量验收规范合格标准，并经验收合格； 2.6标段划分：共1个标段。 中 3．投标人资格要求 3.1 本次招标要求投标人： 3.1.1须具有 国家建设行政主管部门颁发的市政公用工程施工总承包三级及以上资质； 3.1.2信誉要求：不存在投标人须知第1.4.3项规定的限制投标的情形； 3.1.3所有投标人（无资质企业除外）应具有针对本标段的《成都市建设领域市场主体基础信息网络登记表》、 《成都市建设领域从业人员基础信息网络登记表》。 3.1.4 拟派项目经理（项目负责人）具有市政公用工程专业一级或以上注册建造师证书，须具备有效的安全生产 考核合格B证，从2023年01月01日，至投标截止时间具有1个作为项目经理（项目负责人）的已完成的单项合同金 额不低于1200万元的市政公用工程或景观园林绿化工程施工业绩（业绩要求），须为本单位人员（若为联合体投 标，须为联合体牵头人人员）。 3.1.5财务要求： 近3年（限定在3年以内）无亏损； 3.1.6类似工程业绩要求： 近年（2023年01月01日至投标截止时间，不少于3年）已完成的项目共不少于1个类似工程业绩。 类似工程业绩是指:单项合同金额不低于1200万元的市政公用工程或景观园林绿化工程施工业绩。 3.2本次招标不接受联合体投标。 3.3 各投标人均可就上述1个标段投标，可中标的标段数量为1个。 3.4本次招标仅面向中小企业发包（其中属于大企业的分支机构、存在控股股东为大企业、与大企业的负责人为 同一人的情形的企业均不属于中小企业。）。具体标准以《工业和信息化部、国家统计局、国家发展和改革委 员会、财政部关于印发中小企业划型标准规定的通知》（工信部联企业〔2011〕网300号）中的“建筑业”划型标 准为准，投标人应提供中小企业声明函。 4．招标文件的获取 务 4.1凡有意参加投标者，请于2026年09月01日起，在成都市公共资源电子交易云平台(www.cdggzy.com）（以下简称 “电子交易云平台”）免费下载招标资料（招标文件及相关资料），获得“拟投标项目回执”。 4.2招标人 不提供 邮购招标文件服务。 商 5．投标文件的递交 5.1 投标文件递交的截止时间（投标截止时间，下同）为2026年10月13日09时30分，招标人或其委托代理机构，以 及已在投标截止时间前按规定上传投标文件的道投标人，均应在开标当日投标截止时间前登录不见面开标系统 （网址：www.cdggzy.com），录入相关人员姓名、电话等基本信息。投标人未按时登录不 购范围： 本工程所需钢筋混凝土管及相关服务 管 3、采购数量 序号 物资名称 规格型号 单位 数量 备注 国 1 钢筋混凝土承插管 DN200 C35Ⅱ级，P8 米 100 2 钢筋混凝土承插管 DN300 C35Ⅱ级，P8 米 300 3 钢筋混凝土承插管 DN300 C35Ⅱ级，P8含防腐 米 100 中 4 钢筋混凝土承插管 DN400 C35Ⅱ级，P8 米 700 5 钢筋混凝土承插管 DN400 C35Ⅱ级，P8含防腐 米 1300 6 钢筋混凝土承插管 DN500 C35Ⅱ级，P8 米 700 7 钢筋混凝土承插管 DN600 C35Ⅱ级，P8 米 350 8 钢筋混凝土承插管 DN1200 C40Ⅱ级，P8 米 450 9 钢筋混凝土顶管 DN1200C50Ⅲ级，P8 米 400 10 钢筋混凝土顶管 DN1200 C50Ⅲ级，P8含防腐 米 500 11 钢筋混凝土顶管 DN1400C50Ⅲ级P8含防腐 米 100 12 合计 5000 4、交货时间：2026年9月20日（具体时间以邛崃市污水处理厂项目施工现场指定时间为准）。 5、交货地点：邛崃市污水处理厂项目施工现场指定地点 6、质量要求： 6.1产品质量执行国家及行业标准，同时必须满足采购人设计图纸的相关技术要求。上述技术要求有冲突时，以 最高的技术要求为准。 6.2询比响应人所提供混凝土管必须符合相关行业标准。 6.3询比响应人提供的混凝土管不符合规定的技术指标或者存在其它重大质量缺陷的，采购人有权要求响应人免 费更换，并承担需方的一切经济损失。 6.4 防腐要求：钢筋混凝土管内壁采用液体环氧防腐涂料，其做法为:环氧封闭一道，干膜厚≤50um，环氧防腐涂 料三道，干膜厚 400~450um。内防腐涂料的喷涂宜在管道厂内完成，并应符合现行国家标准《建筑防腐蚀工程施 工规范》GB 50212 的有关规定。 6.5采购人在正常使用过程中出现的质量问题，响应人在接到需方通知后，24小时内到达需方现场维修，发生的 维修等相关费及给需方造成的损失由询比响应人承担。 7、付款方式 网 采购方以银行转账或一年期以内（含一年）的商业汇票、应收账款电子凭证、信用证、反向保理等非现金（采 购方承担贴息费用）支付方式向供应商支付货款。 务 每月1日至本月末为一个统计月。供应商将上月1日至上月末(遇采购人假期则顺延)内所送货物的送货单(供货方 保存联)汇总后向采购人指定人员提交对账清单，对账无误，双方确认后，供应商持本期全额增值税专用发票和 《材料结算单》到采购人办理本期结算款，待采购人收到业主当月（当月指项目向业主申请本月工程款，例如4 月份申请4月工程款）工程款后，20个工作日内办理本期结算款70%的付款手续，完工结算完成后支付至85%，待 工程完工结算审计后，12个月内付至结算款的 95%，剩余商5%作为质量保证金，质保期为1年，期满30日内质保金 由采购人方扣除因材除料质量问题而发生的费用后一次性返还。 8、履约担保 道 履约担保的形式：履约保证金或履约保函。 签订合同前卖方须向买方提交合同总金额3%的履约担保。履约担保可以采用银行保函/保证金的形式，受益人为 买方。履约保证金若在中标通知书发布后1月内未及时递交，视为卖方自动放弃本次合同履约，响应保证金不予 管 退还。 履约保证金的有效期： 卖方应保证履约保证金国自本合同生效之日起至买方结清全部合同价款之前一直有效。 履约保证金将在合同履行完毕1个月后（办完结算手续30日内）退还至供应商。 履约保证金有效期内，如卖方违约或发生因卖方责任给施工造成经济损失的，买方将从卖方供货款和履约保证 中 金中，直接扣除违约金以及买方应承担的赔偿经济损失的费用。 履约担保的退还或不予退还并不免除供应商对已交付物资的质量保证责任。 三、供应商资格要求 供应商必须满足以下全部资格要求： 1、供应商为生产厂家的，必须是在中国境内注册的企业法人，具有有效期内的ISO9001质量管理体系认证证书。 产品取得第三方产品检验检测机构（省级或国家级）出具的检测报告。 2、供应商为代理商的，必须是在中国境内注册的企业法人，必须具有生产厂家的授权代理书，且其代理的生产 厂家须满足第1条生产厂家资格条件的要求。 生产企业及其代理商不得同时参加。 3、供应商是增值税一般纳税人，能开具增值税专用发票。 4、供应商应具有类似工程的供货业绩（或注明工程类别），在近3年内的供货合同不少于3个，且签订单项合同 金额均在200万元以上（附合同扫描件或中标通知书）。 5、供应商财务状况良好，没有处于被责令停业，财产被接管、冻结、破产状态。 6、本次采购不接受联合体报价。 四、采购文件的获取 凡有意参加报价者，请于请于2026年9月8日前（北京时间）在中国电建采购招标数智化平
